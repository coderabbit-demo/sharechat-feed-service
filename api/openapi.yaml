openapi: 3.0.3
info:
  title: ShareChat Feed API
  version: 1.0.0
  description: Served by sharechat-feed-service. Consumed by sharechat-android and sharechat-ios.
paths:
  /v1/feed:
    get:
      summary: Get a personalized feed page
      parameters:
        - name: user_id
          in: query
          required: true
          schema: { type: string }
        - name: lang
          in: query
          required: false
          description: Content language code (e.g. hi, ta, te, bn). Defaults to the user's profile language.
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a previous response's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: A page of feed items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedResponse" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/posts/{postId}/comments:
    parameters:
      - name: postId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List comments on a post (pinned first, then oldest first)
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommentPage" }
    post:
      summary: Add a comment to a post
      description: The author is the calling user (X-User-Id header set by the API gateway).
      parameters:
        - name: lang
          in: query
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCommentRequest" }
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
  /v1/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    patch:
      summary: Edit a comment's text
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCommentRequest" }
      responses:
        "200":
          description: Updated comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
    delete:
      summary: Delete your own comment
      responses:
        "204": { description: Deleted }
        "403": { description: Not the author }
  /v1/moderation/comments/{commentId}/hide:
    parameters:
      - name: commentId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Hide a published comment (moderators only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Hidden comment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        "403": { description: Not a moderator }
components:
  schemas:
    FeedResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedItem" }
        next_cursor:
          type: string
          nullable: true
          description: Null when there are no more pages.
    FeedItem:
      type: object
      required: [post_id, author, media, language, created_at]
      properties:
        post_id: { type: string }
        author: { $ref: "#/components/schemas/Author" }
        media: { $ref: "#/components/schemas/Media" }
        caption: { type: string }
        language: { type: string }
        like_count: { type: integer, default: 0 }
        comment_count: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    Author:
      type: object
      required: [id, handle]
      properties:
        id: { type: string }
        handle: { type: string }
        avatar_url: { type: string }
    Media:
      type: object
      required: [type, url]
      properties:
        type:
          type: string
          enum: [image, video, text]
          description: Clients must treat unknown values as "unknown" and skip rendering.
        url: { type: string }
        duration_ms: { type: integer, description: Only for video }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    Comment:
      type: object
      required: [id, post_id, author_id, text, status, pinned, created_at]
      properties:
        id: { type: string }
        post_id: { type: string }
        author_id: { type: string }
        text: { type: string, maxLength: 2000 }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, HIDDEN] }
        pinned: { type: boolean }
        created_at: { type: string, format: date-time }
        edited_at: { type: string, format: date-time, nullable: true }
    CommentPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        next_cursor: { type: string, nullable: true }
    CreateCommentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 2000 }
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, HIDDEN]
          description: Optional; used by the comment migration job to keep the original state.
        pinned: { type: boolean }
    UpdateCommentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 2000 }
