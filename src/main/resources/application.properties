spring.application.name=sharechat-feed-service
server.port=8080

# Use Gson (not Jackson) for HTTP message conversion
spring.mvc.converters.preferred-json-mapper=gson

# Analytics vendor (the same account marketing uses)
analytics.vendor.url=https://ingest.us-east-1.metrics-vendor.example/v1/events
analytics.vendor.api-key=${ANALYTICS_VENDOR_API_KEY}
